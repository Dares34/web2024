<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация и Регистрация</title>
    <link rel="stylesheet" href="authorization.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <button class="back-btn">&larr;</button>
            <h2>Яндекс ID</h2>
        </div>
        <h3>Остался один шаг до Музыки</h3>

        <div class="toggle-buttons">
            <button class="active">Почта</button>
            <button>Телефон</button>
        </div>

        <form class="auth-form">
            <input type="text" placeholder="Логин или email" required>
            <button type="submit" class="submit-btn">Войти</button>
        </form>

        <div class="additional-links">
            <a href="#">Создать ID</a>
        </div>
    </div>
</body>
</html>
